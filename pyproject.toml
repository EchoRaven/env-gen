[project]
name = "forgingground-gen"
version = "0.1.0"
description = "Forgingground environment generator: the multi-agent generation engine (agent/env_generator) plus the env/run registry + live collaboration-hub API that serves the Env Forge UI."
requires-python = ">=3.11"
dependencies = [
    # --- Env Forge API (web service) ---
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.38.0",
    "sqlalchemy>=2.0.46",
    "pydantic>=2.12.5",
    "starlette>=0.49.3",
    # --- generation engine: templating + config ---
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    # --- engine: http clients ---
    "httpx>=0.28.1",
    "requests>=2.32.5",
    "aiohttp>=3.13.3",
    # --- engine: MCP (uses MCP client tools; scaffolds FastMCP servers) ---
    "mcp>=1.20.0",
    "fastmcp>=2.13.0",
    # --- engine: LLM provider SDKs ---
    "google-genai>=1.61.0",
    "openai>=2.21.0",
    "anthropic>=0.77.0",
    # --- engine: reference-image + visual-similarity tooling ---
    "pillow>=11.3.0",
    "numpy>=2.2.6",
    # --- engine: JWT helper used by the backend scaffold ---
    "pyjwt>=2.10.1",
]

[project.optional-dependencies]
# Tooling for running the engine's test suite (cd agent && pytest tests/).
dev = [
    "pytest>=8.0.0",
]

# NOTE: the apps this engine GENERATES carry their own dependency manifests
# (FastAPI + python-jose + bcrypt + cryptography + psycopg for the embedded
# OAuth2 AS, etc.) — those are emitted into each generated env's manifest and
# are deliberately NOT engine dependencies.

[tool.setuptools.packages.find]
# Only the web-service package is importable/installable; the generation engine
# runs as a script:  cd agent && python -m env_generator.llm_generator.main
include = ["app*"]

[tool.pyrefly]
# The engine is rooted at `agent/`, NOT at this file's directory. Every engine module imports
# `utils.*` / `env_generator.*`, and the processes that run them (main.py, `cd agent && pytest
# tests/`) put `agent/` on sys.path, so those imports resolve at runtime. Without this setting
# Pyrefly infers its import root from THIS file and reports `missing-import` on every one:
#
#     Cannot find module `utils.model_limits`
#       Import root (inferred from project layout): "/home/haibotong/forgingground-gen"
#
# 84 files import `utils.*` and 242 import `env_generator.*`, so essentially the whole codebase
# was flagged and any REAL diagnostic was buried. Runtime was never affected.
#
# BOTH roots, exactly the two that main.py puts on sys.path at startup:
#     _agents_dir        = <repo>/agent                            -> `utils.*`, `env_generator.*`
#     _llm_generator_dir = <repo>/agent/env_generator/llm_generator -> `multi_agent.*`, `tools.*`,
#                                                                     `workspace`, `memory.*`
search-path = ["agent", "agent/env_generator/llm_generator"]

# The generated apps are throwaway output, not source: 15987 .py files against 557 real ones
# (29x), and the whole tree is gitignored.
project-excludes = [
    "**/agent/generated/**",
    "**/.venv/**",
    "**/node_modules/**",
    "**/__pycache__/**",
]

[tool.pytest.ini_options]
# `multi_agent/bundled_tests/` holds test files that are SHIPPED INTO a generated
# env and run there against its live stack (see the module docstrings:
# `ZOOM_API_URL=http://localhost:8033 python3 tests/oauth/test_zoom.py`). Collected
# here they can only ever raise ConnectionRefusedError — 60 red herrings that hide
# real failures in a bare `pytest` run. Excluding them changes nothing where they
# actually run: a generated env executes them from its own root and never reads
# this file, so a down service still fails the contract there, as it must.
norecursedirs = ["agent/env_generator/llm_generator/multi_agent/bundled_tests"]
