server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 2m;

  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }
  location /auth/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location = /health { proxy_pass http://backend:8000; }

  location /assets/ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
