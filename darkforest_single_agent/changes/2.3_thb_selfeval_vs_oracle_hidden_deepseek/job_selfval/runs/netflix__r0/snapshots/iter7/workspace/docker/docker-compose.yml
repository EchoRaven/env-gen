services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: netflix
      POSTGRES_USER: netflix
      POSTGRES_PASSWORD: netflix
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../app/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netflix -d netflix"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ../app/backend
    environment:
      DATABASE_URL: postgresql+psycopg://netflix:netflix@database:5432/netflix
      JWT_SECRET: netflix-clone-local-secret-change-me
      BACKEND_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ../app/frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
