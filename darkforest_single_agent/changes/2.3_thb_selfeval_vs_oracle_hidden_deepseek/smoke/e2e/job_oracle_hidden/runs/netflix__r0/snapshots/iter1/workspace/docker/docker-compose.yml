services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: netflix
      POSTGRES_USER: netflix
      POSTGRES_PASSWORD: netflix
    volumes:
      - ../app/database/init:/docker-entrypoint-initdb.d:ro
      - netflix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netflix -d netflix"]
      interval: 3s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ../app/backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://netflix:netflix@database:5432/netflix
      JWT_SECRET: netflix-local-development-secret
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 4s
      timeout: 4s
      retries: 30

  frontend:
    build:
      context: ../app/frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  netflix_pgdata:
