services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: netflix
      POSTGRES_USER: netflix
      POSTGRES_PASSWORD: netflix
    volumes:
      - ../app/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netflix -d netflix"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ../app/backend
      dockerfile: Dockerfile
    environment:
      NETFLIX_PG_HOST: database
      NETFLIX_PG_PORT: "5432"
      NETFLIX_PG_DB: netflix
      NETFLIX_PG_USER: netflix
      NETFLIX_PG_PASSWORD: netflix
      NETFLIX_JWT_SECRET: netflix-local-jwt-secret
    ports:
      - "48000:8000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../app/frontend
      dockerfile: Dockerfile
    ports:
      - "48080:80"
    depends_on:
      - backend
    restart: unless-stopped
