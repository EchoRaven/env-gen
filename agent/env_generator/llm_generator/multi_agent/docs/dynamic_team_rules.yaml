dynamic_team_governance:
  # Spawn guardrails
  spawn_window_seconds: 120
  spawn_budget_per_window: 24
  max_active_per_parent: 8

  # Failure/circuit guardrails
  failure_window_seconds: 300
  circuit_min_samples: 8
  circuit_threshold: 0.55
  circuit_cooldown_seconds: 45

  # Idempotency / contract limits
  subtask_fingerprint_ttl_seconds: 900
  subtask_task_max_chars: 8000

  # Adaptive concurrency
  read_mostly_max_parallel: 8
  write_low_risk_max_parallel: 6
  write_medium_risk_max_parallel: 3
  write_high_risk_max_parallel: 2

  # Failure-rate feedback to throttle concurrency
  failure_rate_medium_threshold: 0.3
  failure_rate_high_threshold: 0.5
  failure_rate_medium_cap: 3
  failure_rate_high_cap: 2
