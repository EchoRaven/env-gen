  # Design Analyst — one-shot pre-generation agent (NOT a resident lane). Spawned once at
  # run start with the reference set + staged real-asset manifest; runs the Page-Mimicry field
  # manual's per-component measure loop (crop + eyedrop + pixel geometry) and emits
  # design/design_system.json + .md that the frontend/backend lanes build FROM. Detect+measure,
  # never guess. Tools: the material-prep chain (reference_images = sample_color/crop_reference/
  # extract_palette/zoom_compare/measure_layout; vision_tools = decompose_reference) + file read/write.
  design_analyst:
    name: "Design Analyst"
    reasoning_effort: "high"
    description: "One-shot pre-generation design agent: decomposes each reference into components and MEASURES each (crop + eyedrop + pixel geometry) → emits design/design_system.json + .md the lanes build from. Measure, never guess."
    tool_categories: ["file", "reasoning", "vision", "reference", "communication", "memory", "project", "analysis", "knowledge_read", "runtime", "progress"]
    include_vision: true
    timeout: 3600
    execution_pipeline:
      # F1 (design convergence, 2026-07-21): the analyst historically burned all 15 action
      # rounds/step on vision calls without ever writing design_system.json (r3: ~880 vision
      # calls, 0 writes, still on "Step 1/2000"). Capping rounds/step makes each step finish
      # sooner so the loop advances toward the write+finish moves instead of grinding. The
      # deterministic completion floor + single-shot enrich remain the authoritative backstop,
      # and ENVGEN_DESIGN_ANALYST_TIMEOUT (now 600s) bounds the block regardless.
      max_action_rounds_per_step: 4
    prompts:
      template: "v3/design_analyst.j2"
      system_macro: "design_analyst_system_prompt"
      task_macro: "design_analyst_task_prompt"
    flags:
      dynamic: true
      can_spawn: false
    skills: []
    tool_bundles:
      - reasoning_tools
      - project_tools
      - analysis_tools
      - knowledge_read_tools
      - reference_images
      - vision_tools
    # Without an allowlist the ranker capped the offered set at ~10 tools and dropped the
    # file-emission + crop/view tools, so the analyst could measure but not write
    # design_system.json (→ "cannot complete file emission" → orchestrator single-shot fallback,
    # unenriched doc). Pin the measurement AND file/crop/view tools (+ finish) so all are offered.
    stage_tool_allowlist:
      action:
        - extract_palette
        - decompose_reference
        - crop_reference
        - measure_layout
        - sample_color
        - zoom_compare
        - list_reference_images
        - copy_reference_image
        - view_image
        - read
        - write
        - edit
        - apply_patch
        - update_json_path
        - update_yaml_path
        - glob
        - grep
        - report_progress
        - report_completion
        - report_issue
        - send_message
        - check_inbox
        - finish

resident_lanes:
  # roster aligned to the 6-lane
  # reality. Retired: design (merged into frontend),
  # database (merged into backend), architect_reviewer + visual_reviewer
  # (subsumed by verifier's expanded responsibilities), and
  # bug_triage_orchestrator (replaced by ``debugger``). The 6 lanes
  # below match agent_subscriptions.DEFAULT_SUBSCRIPTIONS + the v3
  # prompt graph in prompts/v3/*.j2. See
  # docs/pipeline_post_kickoff_architecture.md §4 Stage 5.
  orchestrator:
    profile: orchestrator
    resident: true
    description: "Resident global orchestration lane"
  backend:
    profile: backend
    resident: true
    description: "Resident backend team-lead lane (owns API + DB schema)"
  frontend:
    profile: frontend
    resident: true
    description: "Resident frontend team-lead lane (owns UI + design specs)"
  verifier:
    profile: verifier
    resident: true
    description: "Resident verification + validation lane (subsumes architect_reviewer + visual_reviewer)"
  debugger:
    profile: debugger
    resident: true
    description: "Resident bug-triage lane (root-cause analysis + assigns remediation to owning agent; replaces bug_triage_orchestrator)"
  # RETIRED (#1202ch): the knowledge lane. It spawned, registered 69 tools, woke once per
  # milestone on `kickoff_complete`, matched nothing in its own wake_contract table and
  # emitted `{"kind":"summarization_ack","action":"skipped","reason":"no matching trigger"}`.
  # Measured across six runs spanning 22 to 354 minutes, its log volume was CONSTANT at
  # 25-37 lines while every working lane scaled with the run — the signature of a lane that
  # only ever boots. Its two intended jobs were already elsewhere or unreachable:
  # `query_knowledge` is answered directly by `store.search()` (32 calls in r35, none of
  # them through this lane), and the learning-capture loop was broken in three places at
  # once — every lane's prompt says "Default: skip" for submit_learning (0 calls in 18315
  # corpus tasks), this lane subscribed only to `kickoff_complete` rather than to the
  # `learning_event` its contract table names, and no task in the corpus was ever assigned
  # to it (0 of 18315). Knowledge collection now lives OUTSIDE the pipeline; the store, the
  # query/store tools and the knowledge_* tool bundles are untouched and remain available
  # to whatever curates them.

# Resident lane dispatch graph - which resident lane notifies which downstream lane.
# Agents use HubRegistry (RegistryHub, WorkHub, CodeHub, EventHub) for observation-driven coordination.
# MessageBus remains the explicit notification channel.
resident_workflow:
  # graph re-derived for the 6-lane
  # roster. Edges through retired design/database
  # collapsed into backend (which now owns both API + schema) and
  # frontend (which now owns UI design). Verifier fans out to
  # debugger (new bug-triage lane) instead of the retired
  # bug_triage_orchestrator.
  orchestrator:
    notifies: [backend, frontend, verifier]
  backend:
    notifies: [frontend, verifier]
  frontend:
    notifies: [verifier]
  verifier:
    notifies: [orchestrator, backend, frontend, debugger]
  debugger:
    notifies: [backend, frontend, orchestrator]
