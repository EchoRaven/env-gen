    <!-- Inline SVG favicon (brand accent dot) so the browser never requests
         /favicon.ico, which the static server has no file for (404 in console). -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/design-tokens.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/styles/homepage.css" />
    <link rel="stylesheet" href="/styles/hubs.css" />

    <!-- Cutover 43.14: highlight.js for syntax-colored code views -->
    <link rel="stylesheet" id="hljs-light-theme" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/github.min.css" />
    <link rel="stylesheet" id="hljs-dark-theme" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/github-dark.min.css" disabled />
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/highlight.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Cutover 43: Tailwind CSS CDN for rapid utility-driven layout.
         Preflight reset disabled to avoid clobbering existing custom styles. -->
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
      tailwind.config = {
        corePlugins: { preflight: false },
        darkMode: ["class", '[data-theme="dark"]'],
        theme: {
          extend: {
            colors: {
              bg: {
                DEFAULT: "var(--bg-primary)",
                secondary: "var(--bg-secondary)",
                tertiary: "var(--bg-tertiary)",
                elevated: "var(--bg-elevated)",
                hover: "var(--bg-hover)",
                active: "var(--bg-active)",
                sidebar: "var(--bg-sidebar)",
                canvas: "var(--bg-canvas)",
                ink: "var(--bg-ink)",
              },
              fg: {
                DEFAULT: "var(--text-primary)",
                secondary: "var(--text-secondary)",
                muted: "var(--text-muted)",
                "on-accent": "var(--text-on-accent)",
              },
              accent: {
                DEFAULT: "var(--accent)",
                hover: "var(--accent-hover)",
                soft: "var(--accent-soft)",
                "on-soft": "var(--accent-on-soft)",
              },
              border: {
                DEFAULT: "var(--border)",
                strong: "var(--border-strong)",
                subtle: "var(--border-subtle)",
              },
              success: { DEFAULT: "var(--success)", soft: "var(--success-soft)" },
              warning: { DEFAULT: "var(--warning)", soft: "var(--warning-soft)" },
              danger:  { DEFAULT: "var(--danger)",  soft: "var(--danger-soft)" },
              info:    { DEFAULT: "var(--info)",    soft: "var(--info-soft)" },
            },
            fontFamily: {
              sans: ["Geist", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"],
              mono: ["Geist Mono", "SF Mono", "Menlo", "Monaco", "monospace"],
              serif: ["Instrument Serif", "Times New Roman", "Georgia", "serif"],
            },
            // rem-based so html font-size scaling (Cutover 43.15) propagates
            // to every Tailwind text-* class. Base sizes match the previous px
            // table assuming the default 16px root.
            fontSize: {
              "2xs": ["0.625rem", "1.3"],    // 10px @ 16
              xs:    ["0.6875rem", "1.4"],   // 11px
              sm:    ["0.75rem", "1.5"],     // 12px
              base:  ["0.8125rem", "1.55"],  // 13px
              md:    ["0.875rem", "1.5"],    // 14px
              lg:    ["0.9375rem", "1.5"],   // 15px
              xl:    ["1.0625rem", "1.4"],   // 17px
              "2xl": ["1.25rem", "1.3"],     // 20px
              "3xl": ["1.5rem", "1.25"],     // 24px
              "4xl": ["2rem", "1.2"],        // 32px
              "5xl": ["3rem", "1.05"],       // 48px
            },
          },
        },
      };
    </script>
  </head>
  <body>

    <script type="text/babel" src="/src/icons.jsx"></script>
    <script type="text/babel" src="/src/project_shell.jsx"></script>
    <script type="text/babel" src="/src/app.jsx"></script>
  </body>
</html>
