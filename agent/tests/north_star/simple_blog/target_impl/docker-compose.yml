services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Ephemeral port via RUNNER_HOST_PORT (R2 round-11 pre-pilot:
      # static port = INADMISSIBLE for env.port_conflict V9).
      - "${RUNNER_HOST_PORT:-8002}:3000"
    # R2 round-13 by-construction symmetric mem_limit (see runner.py / spec §3 env.oom).
    mem_limit: ${RUNNER_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s
