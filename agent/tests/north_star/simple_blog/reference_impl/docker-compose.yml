services:
  backend:
    build: ./backend
    ports:
      # Ephemeral port via RUNNER_HOST_PORT (R2 round-11 pre-pilot:
      # static port = INADMISSIBLE for env.port_conflict V9). The
      # spike runner injects RUNNER_HOST_PORT; bare `docker compose up`
      # falls back to 8001 for back-compat.
      - "${RUNNER_HOST_PORT:-8001}:8000"
    # R2 round-13 by-construction: symmetric mem_limit makes app self-leak
    # surface as own-cgroup OOM (OOMKilled=True → step-1 carve-out →
    # FUNCTIONAL), so any surviving dmesg CONSTRAINT_NONE is genuinely
    # co-tenant. See classifier.py _check_oom + spec §3 env.oom row.
    mem_limit: ${RUNNER_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s
